<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutout Studio</title>
<style>
  :root{--paper:#e9e2d0;--ink:#2b2622;--sky:#7fb4e6;--red:#c8322b;--panel:#f6f1e4;--accent:#1c5fa8}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 Georgia,"Times New Roman",serif}
  header{padding:12px 16px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:22px}
  header small{opacity:.7}
  .stage{position:relative;margin:0 12px;background:var(--sky);border:3px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
  svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
  .hit{fill:transparent;cursor:grab}
  .handle{fill:#fff;stroke:var(--ink);stroke-width:1.6;pointer-events:none;opacity:.9}
  .handle.sel{fill:#ffd400}
  .hide-handles .handle{display:none}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px}
  .panel{margin:8px 12px;background:var(--panel);border:2px solid var(--ink);border-radius:6px;padding:10px 12px}
  .panel h2{margin:0 0 8px;font-size:16px}
  button{font:inherit;font-size:14px;padding:8px 12px;border:2px solid var(--ink);border-radius:5px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  button:active{transform:translate(2px,2px);box-shadow:none}
  button.primary{background:var(--red);color:#fff}
  button.big{font-size:17px;padding:12px 18px;flex:1}
  button.tog.on{background:#ffd400}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  label{display:flex;align-items:center;gap:8px;font-size:14px}
  input[type=range]{flex:1;min-width:120px;accent-color:var(--red)}
  input[type=number],input[type=text],select{font:inherit;font-size:14px;padding:6px 7px;border:2px solid var(--ink);border-radius:4px;background:#fff}
  .frames{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
  .frame{flex:0 0 auto;width:64px;height:52px;border:2px solid var(--ink);border-radius:4px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
  .frame.cur{background:#ffd400}
  .frame small{opacity:.6;font-size:10px}
  textarea{width:100%;height:110px;font:12px/1.3 monospace;border:2px solid var(--ink);border-radius:4px;padding:6px}
  .grid{display:grid;grid-template-columns:1fr;gap:8px}
  @media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
  .hint{font-size:13px;opacity:.75;margin:4px 0 0}
</style>
</head>
<body>
<header>
  <h1>Cutout Studio</h1>
  <small>Drag a white dot and the limb follows your finger.</small>
</header>

<div class="stage" id="stage">
  <svg id="svg" viewBox="0 0 360 440" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="404" width="360" height="40" fill="#5ea24a"/>
    <rect x="0" y="400" width="360" height="8" fill="#3f7a33"/>
    <g id="rig" transform="scale(1.5)"></g>
  </svg>
</div>

<div class="row">
  <button class="primary big" id="btnAddKey">+ Add keyframe</button>
  <button class="big" id="btnReset">Reset pose</button>
</div>

<div class="panel">
  <div class="row" style="padding:0 0 6px">
    <select id="animList" style="flex:1"></select>
    <button id="btnLoad">Load</button>
    <button class="primary" id="btnPlay">Play</button>
    <button id="btnStop">Stop</button>
  </div>
  <div class="frames" id="frames"></div>
  <div class="row" style="padding:0 0 6px">
    <button id="btnUpdKey">Update current</button>
    <button id="btnDelKey">Delete current</button>
    <label>hold <input type="number" id="nHold" min="1" max="30" value="3" style="width:56px"></label>
    <label>sound <select id="selSound"><option value="">none</option></select></label>
    <label>fx <input type="text" id="nFx" placeholder="ball, sparks…" style="width:90px"></label>
  </div>
  <div class="row" style="padding:0">
    <label>fps <input type="number" id="nFps" min="2" max="24" value="8" style="width:56px"></label>
    <label><input type="checkbox" id="chkLoop" checked> loop</label>
    <label><input type="checkbox" id="chkStep" checked> jerky</label>
    <input type="text" id="animName" placeholder="name" style="width:130px">
    <button class="primary" id="btnSave">Save</button>
    <button id="btnDelAnim">Delete</button>
  </div>
</div>

<div class="panel">
  <h2>Mouth &amp; eyes</h2>
  <div class="row" style="padding:0 0 6px">
    <button class="tog mouth" data-m="0">Closed</button>
    <button class="tog mouth" data-m="1">Open</button>
    <button class="tog mouth" data-m="2">Open ↶</button>
    <button class="tog mouth" data-m="3">Open ↷</button>
    <button class="tog mouth" data-m="4">Loud!</button>
    <button class="tog" id="btnEyes">Eyes closed</button>
    <button class="tog" id="btnSquint">Eyes &gt;&lt;</button>
    <button class="tog" id="btnXX">Eyes X X</button>
  </div>
  <div class="row" style="padding:0">
    <input type="text" id="sayText" value="Hello there, FRIEND!" style="flex:1;min-width:140px">
    <button id="btnSay">Say it</button>
  </div>
</div>

<div class="panel" id="jointPanel">
  <h2>Joint: <span id="jointName">none</span></h2>
  <div class="grid">
    <label>Rotate <input type="range" id="sRot" min="-180" max="180" step="1"> <span id="vRot">0</span>°</label>
    <label>X <input type="range" id="sX" min="-100" max="100" step="1"> <span id="vX">0</span></label>
    <label>Y <input type="range" id="sY" min="-100" max="100" step="1"> <span id="vY">0</span></label>
  </div>
  <div class="row" style="padding:6px 0 0"><label><input type="checkbox" id="chkHandles" checked> show joints</label></div>
</div>

<div class="panel">
  <h2>Export / import</h2>
  <div class="row" style="padding:0 0 6px">
    <button class="primary" id="btnDownload">Download animations.json</button>
    <button id="btnExport">Show JSON</button>
    <button id="btnImport">Import from text</button>
    <button id="btnDefaults">Restore defaults</button>
  </div>
  <textarea id="jsonBox" placeholder="Paste animations.json here and press Import."></textarea>
  <p class="hint">Download the JSON and load it in the game via its ⚙ settings.</p>
</div>

<script>
window.ASSETS={};
</script>
<script>
// ===== Shared rig for Cutout Studio + game =====
const R = {
  root:   {parent:null,    px:120, py:205, tip:[0,0],   move:true},
  torso:  {parent:'root',  px:0,   py:0,   tip:[0,-26]},
  head:   {parent:'torso', px:0,   py:-58, tip:[0,10]},
  top:    {parent:'head',  px:0,   py:0,   tip:null},
  lIris:  {parent:'top',   px:-9,  py:-28, tip:[0,0],   move:true, small:true},
  rIris:  {parent:'top',   px:9,   py:-28, tip:[0,0],   move:true, small:true},
  hat:    {parent:'top',   px:0,   py:-60, tip:[0,-12], move:true},
  lUpper: {parent:'torso', px:-30, py:-40, tip:[0,34]},
  lLower: {parent:'lUpper',px:0,   py:34,  tip:[0,30]},
  lHand:  {parent:'lLower',px:0,   py:30,  tip:[0,14]},
  rUpper: {parent:'torso', px:30,  py:-40, tip:[0,34]},
  rLower: {parent:'rUpper',px:0,   py:34,  tip:[0,30]},
  rHand:  {parent:'rLower',px:0,   py:30,  tip:[0,14]},
  lThigh: {parent:'torso', px:-14, py:8,   tip:[0,22]},
  lShin:  {parent:'lThigh',px:0,   py:22,  tip:[0,20]},
  lFoot:  {parent:'lShin', px:0,   py:20,  tip:[-14,6]},
  rThigh: {parent:'torso', px:14,  py:8,   tip:[0,22]},
  rShin:  {parent:'rThigh',px:0,   py:22,  tip:[0,20]},
  rFoot:  {parent:'rShin', px:0,   py:20,  tip:[14,6]},
};
const ORDER=['root','torso','lThigh','lShin','lFoot','rThigh','rShin','rFoot','lUpper','lLower','lHand','rUpper','rLower','rHand','head','top','lIris','rIris','hat'];
const PRETTY={root:'Body position',torso:'Torso',head:'Head',top:'Head top',lIris:'Left eye',rIris:'Right eye',hat:'Hat',
  lUpper:'Left arm',lLower:'Left elbow',lHand:'Left hand',rUpper:'Right arm',rLower:'Right elbow',rHand:'Right hand',
  lThigh:'Left hip',lShin:'Left knee',lFoot:'Left foot',rThigh:'Right hip',rShin:'Right knee',rFoot:'Right foot'};
const MOUTH=[[0,0,0],[0,-10,0],[0,-10,-12],[0,-10,12],[0,-26,0]];
const DEFAULT={lUpper:{r:-20},rUpper:{r:20},lLower:{r:-10},rLower:{r:10}};
const clone=o=>JSON.parse(JSON.stringify(o));
function blankPose(){const p={mouth:0,eyes:0};for(const k in R)p[k]={x:0,y:0,r:0};return p;}
function defaultPose(){const p=blankPose();for(const k in DEFAULT)Object.assign(p[k],DEFAULT[k]);return p;}
// pose(over): default pose with overrides, e.g. pose({rUpper:{r:-150},mouth:2})
function pose(over={}){const p=defaultPose();for(const k in over){if(!(k in p))continue;if(typeof over[k]==='object')Object.assign(p[k],over[k]);else p[k]=over[k];}return p;}

const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const OUT={stroke:'#2b2622','stroke-width':2.5,'stroke-linejoin':'round'};
const limb=(w,h,fill)=>g=>g.append(el('rect',{x:-w/2,y:-4,width:w,height:h+4,rx:w/2,fill,...OUT}));
let clipN=0;
const SHAPES={
  torso:g=>g.append(el('rect',{x:-32,y:-48,width:64,height:60,rx:14,fill:'#c8322b',...OUT})),
  lUpper:limb(16,36,'#c8322b'),rUpper:limb(16,36,'#c8322b'),lLower:limb(14,32,'#c8322b'),rLower:limb(14,32,'#c8322b'),
  lHand:g=>g.append(el('circle',{cx:0,cy:6,r:9,fill:'#f2c9a0',...OUT})),rHand:g=>g.append(el('circle',{cx:0,cy:6,r:9,fill:'#f2c9a0',...OUT})),
  lThigh:limb(18,24,'#2f3e6b'),rThigh:limb(18,24,'#2f3e6b'),lShin:limb(16,22,'#2f3e6b'),rShin:limb(16,22,'#2f3e6b'),
  lFoot:g=>g.append(el('rect',{x:-20,y:-2,width:30,height:12,rx:5,fill:'#2b2622',...OUT})),
  rFoot:g=>g.append(el('rect',{x:-10,y:-2,width:30,height:12,rx:5,fill:'#2b2622',...OUT})),
  head(g){const id='clipBot'+(clipN++);const cp=el('clipPath',{id});cp.append(el('rect',{x:-60,y:-16,width:120,height:70}));g.append(cp);
    const b=el('g',{'clip-path':`url(#${id})`});b.append(el('ellipse',{cx:0,cy:-22,rx:46,ry:44,fill:'#f2c9a0',...OUT}));g.append(b);
    g.append(el('rect',{x:-24,y:-19,width:48,height:6,rx:3,fill:'#2b2622'}));},
  top(g){const id='clipTop'+(clipN++);const cp=el('clipPath',{id});cp.append(el('rect',{x:-60,y:-90,width:120,height:74}));g.append(cp);
    const t=el('g',{'clip-path':`url(#${id})`});
    t.append(el('ellipse',{cx:0,cy:-22,rx:46,ry:44,fill:'#f2c9a0',...OUT}));
    t.append(el('path',{d:'M-46,-28 Q-40,-64 0,-66 Q40,-64 46,-28 Q30,-54 0,-52 Q-30,-54 -46,-28 Z',fill:'#5a3a1e',...OUT}));
    g.append(t);
    for(const s of[-1,1])g.append(el('ellipse',{class:'eyewhite',cx:s*12,cy:-30,rx:9,ry:11,fill:'#fff',...OUT}));},
  lIris:g=>g.append(el('circle',{cx:0,cy:0,r:2.8,fill:'#2b2622'})),
  rIris:g=>g.append(el('circle',{cx:0,cy:0,r:2.8,fill:'#2b2622'})),
  hat(g){g.append(el('path',{d:'M-30,8 Q-30,-14 0,-16 Q30,-14 30,8 Z',fill:'#2f7d3a',...OUT}));
    g.append(el('rect',{x:-32,y:2,width:64,height:12,rx:5,fill:'#e0d7c2',...OUT}));
    g.append(el('circle',{cx:0,cy:-15,r:5,fill:'#c8322b',...OUT}));},
  root(){}
};
// ===== Props: costume pieces, hidden unless an animation lists them in anim.props =====
// z: 'back' = behind the joint's own shape, 'mid' = over the shape but under child limbs, default = on top of everything
const torch=g=>{g.append(el('rect',{x:-4,y:-34,width:8,height:40,rx:3,fill:'#8a5a2b',...OUT}));g.append(el('rect',{x:-6,y:-38,width:12,height:8,rx:2,fill:'#c8322b',...OUT}));};
const flare=g=>g.append(el('path',{d:'M-8,0 L-22,26 L22,26 L8,0 Z',fill:'#8e44ad',...OUT}));
const PROPS={
  torchL:{joint:'lHand',draw:torch}, torchR:{joint:'rHand',draw:torch},
  afro:{joint:'head',z:'back',draw:g=>{for(const [x,y,r] of [[0,-56,40],[-34,-40,26],[34,-40,26],[-40,-14,20],[40,-14,20],[-18,-70,22],[18,-70,22]])g.append(el('circle',{cx:x,cy:y,r,fill:'#2b2622',...OUT}));}},
  shades:{joint:'top',draw:g=>{for(const s of[-1,1])g.append(el('circle',{cx:s*12,cy:-30,r:12,fill:'#2b2622',...OUT}));g.append(el('rect',{x:-3,y:-32,width:6,height:3,fill:'#2b2622'}));}},
  flareL:{joint:'lShin',z:'back',draw:flare}, flareR:{joint:'rShin',z:'back',draw:flare},
  discoShirt:{joint:'torso',z:'mid',draw:g=>g.append(el('rect',{x:-32,y:-48,width:64,height:60,rx:14,fill:'#f39c12',...OUT}))},
};
function buildRig(container){
  const groups={};
  for(const id of ORDER){const g=el('g',{class:'j_'+id});SHAPES[id]&&SHAPES[id](g);groups[id]=g;(R[id].parent?groups[R[id].parent]:container).append(g);}
  // eyelids drawn on top of irises
  const lids=el('g',{class:'lids'});
  for(const s of[-1,1])lids.append(el('ellipse',{cx:s*12,cy:-30,rx:9,ry:11,fill:'#f2c9a0',...OUT}));
  groups.top.insertBefore(lids,groups.hat);groups.lids=lids;
  // squint '><' drawn over the closed lids (eyes=2)
  const squint=el('g',{class:'squint'});
  squint.append(el('path',{d:'M-19,-37 L-8,-30 L-19,-23',fill:'none',stroke:'#2b2622','stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round'}));
  squint.append(el('path',{d:'M19,-37 L8,-30 L19,-23',fill:'none',stroke:'#2b2622','stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round'}));
  groups.top.insertBefore(squint,groups.hat);groups.squint=squint;
  // knocked-out 'X X' (eyes=3)
  const xx=el('g',{class:'xx'});
  for(const s of[-1,1]){xx.append(el('path',{d:`M${s*12-7},-37 L${s*12+7},-23 M${s*12+7},-37 L${s*12-7},-23`,fill:'none',stroke:'#2b2622','stroke-width':3.5,'stroke-linecap':'round'}));}
  groups.top.insertBefore(xx,groups.hat);groups.xx=xx;
  groups.eyewhites=[...groups.top.querySelectorAll('.eyewhite')];
  groups.props={};
  for(const name in PROPS){const p=PROPS[name],g=el('g',{class:'prop_'+name});g.style.display='none';p.draw(g);
    const host=groups[p.joint];
    if(p.z==='back')host.insertBefore(g,host.firstChild);
    else if(p.z==='mid')host.insertBefore(g,[...host.children].find(c=>/^j_/.test(c.getAttribute('class')||''))||null);
    else host.append(g);
    groups.props[name]=g;}
  return groups;
}
// Irises are clamped inside the eye whites (ellipse rx 9, ry 11 at (±12,-30), iris r 2.8) so they never poke out.
const EYE={ax:5.2,ay:7.2,cy:-30};
function clampIris(id,j,p){const cx=id==='lIris'?-12:12;let dx=j.px+p.x-cx,dy=j.py+p.y-EYE.cy;const k=Math.hypot(dx/EYE.ax,dy/EYE.ay);
  if(k<=1)return p;dx/=k;dy/=k;return {x:cx+dx-j.px,y:EYE.cy+dy-j.py,r:p.r};}
function applyPose(groups,pose){
  for(const id of ORDER){const j=R[id];let p=pose[id]||{x:0,y:0,r:0};
    if(id==='top'){const m=MOUTH[pose.mouth||0];p={x:m[0],y:m[1],r:m[2]};}
    if(id==='lIris'||id==='rIris')p=clampIris(id,j,p);
    groups[id].setAttribute('transform',`translate(${j.px+p.x},${j.py+p.y}) rotate(${p.r})`);}
  const marks=pose.eyes>=2;
  groups.lids.style.display=pose.eyes===1?'':'none';
  groups.squint.style.display=pose.eyes===2?'':'none';
  groups.xx.style.display=pose.eyes===3?'':'none';
  groups.eyewhites.forEach(e=>e.style.display=marks?'none':'');
  groups.lIris.style.display=groups.rIris.style.display=marks?'none':'';
}
function createDoll(container){const groups=buildRig(container);
  const d={groups,pose:defaultPose(),apply(){applyPose(groups,d.pose);},set(p){d.pose=clone(p);d.apply();},
    setProps(list){list=list||[];for(const n in groups.props)groups.props[n].style.display=list.includes(n)?'':'none';}};
  d.apply();return d;}

// ===== Phrases (shared by game and the voice build script) =====
const PHRASES={
  praise:{'nl-NL':['Ja! Goed zo!','Super!','Hoera!','Jippie!','Knap hoor!'],'en-GB':['Yes! Well done!','Super!','Hooray!'],'de-DE':['Ja! Super!','Toll!','Hurra!']},
  oops:{'nl-NL':['Hmm, nee.','Oeps!','Nog een keer!'],'en-GB':['Hmm, no.','Oops!','Try again!'],'de-DE':['Hmm, nein.','Hoppla!','Nochmal!']},
  numbers:{'nl-NL':['één','twee','drie','vier','vijf'],'en-GB':['one','two','three','four','five'],'de-DE':['eins','zwei','drei','vier','fünf']},
  letters:[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],
};
if(typeof module!=='undefined')module.exports={PHRASES};

// ===== Sound effects (synthesised; swap for mp3s later if you like) =====
const SFX=(()=>{
  let ctx;const ac=()=>{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx;};
  function sweep(type,f0,f1,dur,vol=0.3,at=0){const c=ac(),t=c.currentTime+at;const o=c.createOscillator(),g=c.createGain();o.type=type;
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur);}
  function burst(dur,ftype,freq,vol=0.5,at=0){const c=ac(),t=c.currentTime+at;const n=c.createBufferSource();const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);
    const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;const f=c.createBiquadFilter();f.type=ftype;f.frequency.value=freq;
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);n.connect(f).connect(g).connect(c.destination);n.start(t);}
  function fart(big){const c=ac(),t=c.currentTime,d=big?1.1:0.45;const o=c.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(big?60:85,t);o.frequency.exponentialRampToValueAtTime(big?38:55,t+d);
    const lfo=c.createOscillator();lfo.frequency.value=big?9:14;const lg=c.createGain();lg.gain.value=big?28:18;lfo.connect(lg).connect(o.frequency);
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=c.createGain();g.gain.setValueAtTime(0.001,t);
    g.gain.exponentialRampToValueAtTime(0.7,t+0.03);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(f).connect(g).connect(c.destination);o.start(t);lfo.start(t);o.stop(t+d);lfo.stop(t+d);}
  const S={
    fart:()=>fart(false), bigfart:()=>fart(true),
    boing:()=>sweep('sine',180,720,0.28,0.35),
    slip:()=>sweep('sawtooth',900,180,0.3,0.15),
    thud:()=>{burst(0.25,'lowpass',180,0.9);sweep('sine',90,38,0.25,0.5);},
    whistle:()=>sweep('sine',1500,450,0.85,0.2),
    splat:()=>{burst(0.2,'bandpass',700,0.8);sweep('square',320,70,0.16,0.15);},
    sneeze:()=>{burst(0.14,'bandpass',1800,0.25);burst(0.35,'lowpass',1600,0.9,0.18);sweep('sawtooth',650,140,0.3,0.15,0.18);},
    ding:()=>{sweep('sine',880,880,0.16,0.25);sweep('sine',1320,1320,0.28,0.25,0.15);},
    pop:()=>sweep('sine',300,900,0.07,0.3),
    spin:()=>sweep('triangle',350,1500,0.5,0.2),
    plof:()=>{burst(0.18,'lowpass',140,0.9);sweep('sine',70,30,0.2,0.4);},
    oef:()=>sweep('sawtooth',420,160,0.22,0.2),
    au:()=>sweep('square',600,900,0.18,0.15),

// makePlayer(doll,{fx}): fx(name,frame,anim) is called when a keyframe with an `fx` field starts (the game draws overlays).

    const fr=anim.frames,fps=anim.fps||8;let i=0,sub=0;onDone=done;doll.setProps(anim.props);
    const tick=()=>{const k=fr[i],n=fr[(i+1)%fr.length];

      F(6,{head:{r:-12},mouth:1,lIris:{x:-6},rIris:{x:-6}}),F(5,{head:{r:6},mouth:3,eyes:2},'snicker'),F(4,{head:{r:-6},mouth:2,eyes:2}),F(2,base)]),
    // roman candles: arms out, hips sway, then one torch behind the bum, toot, flame jet
    slap_sparklers:(()=>{const arms={lUpper:{r:90},rUpper:{r:-90},lLower:{r:0},rLower:{r:0},lHand:{r:-90},rHand:{r:90},root:{x:30}};   // straight out, torches upright; body shifted right so the left hand stays on screen
      const sway=d=>({...arms,root:{x:30+6*d},torso:{r:8*d},head:{r:-6*d},lThigh:{r:-8*d},rThigh:{r:-8*d},mouth:d>0?2:3});
      const bum={root:{y:-6,x:10},torso:{r:-16},head:{r:-8},lThigh:{r:26},rThigh:{r:22},lShin:{r:-12},rShin:{r:-12},lUpper:{r:-100},lLower:{r:-20},lHand:{r:100},rUpper:{r:38},rLower:{r:0},rHand:{r:-128}};
      return A(8,[F(1,{...arms,mouth:1},'sparkle','sparks'),F(3,sway(1)),F(3,sway(-1)),F(3,sway(1)),F(3,sway(-1)),F(3,sway(1)),F(3,sway(-1)),
        F(3,{...arms,mouth:1,eyes:0,lIris:{x:4},rIris:{x:4}}),F(3,{...bum,mouth:0,eyes:1}),
        F(1,{...bum,mouth:4,eyes:2},'fart'),...SH(4,{...bum,mouth:4,eyes:2,hat:{y:-10,r:10}},'whoosh','flame',3),F(3,{...bum,mouth:1,eyes:2}),
        F(2,{mouth:1,eyes:0,lIris:{x:-4},rIris:{x:4}}),F(2,base)],{props:['torchL','torchR']});})(),
    // 10 s dances for every 10th correct answer (80 frames at 8 fps), music of the same length
    dance_riverdance:seq(8,80,i=>{const ph=i%8,stiff={lUpper:{r:4},rUpper:{r:-4},lLower:{r:0},rLower:{r:0},mouth:0,eyes:0,lIris:{x:2},rIris:{x:-2}};
      const bob={root:{y:i%2?-10:0}};
      if(i>=64)return {...stiff,root:{y:i%2?-30:-6},lThigh:{r:-100+(i%2)*30},rThigh:{r:100-(i%2)*30},lShin:{r:90},rShin:{r:-90},head:{r:i%2?8:-8},mouth:4,sound:i%4===0?'boing':''};   // finale: both legs out, knees backwards
      if(ph<2)return {...stiff,...bob,lThigh:{r:-120},lShin:{r:-70},lFoot:{r:40},rShin:{r:5}};        // left kick, knee bent the wrong way
      if(ph<4)return {...stiff,...bob,lThigh:{r:20},lShin:{r:60},rThigh:{r:0}};                       // left leg back
      if(ph<6)return {...stiff,...bob,rThigh:{r:120},rShin:{r:70},rFoot:{r:-40},lShin:{r:-5}};       // right kick
      return {...stiff,root:{y:ph===7?-26:0},sound:ph===6?'thud':''};                                  // hop
    },{music:'jig'}),
    dance_disco:seq(8,80,i=>{const d=i%4<2?1:-1,ph=i%16,face={eyes:0,mouth:i%2?1:3,lIris:{x:2},rIris:{x:-2}};
      const hips={root:{x:8*d,y:i%2?-4:0},torso:{r:-8*d},head:{r:6*d},lThigh:{r:-12*d},rThigh:{r:-12*d},lShin:{r:14*d},rShin:{r:14*d}};
      const point={lUpper:{r:d>0?-170:-30},lLower:{r:0},rUpper:{r:d>0?30:170},rLower:{r:0},lHand:{r:d>0?0:-40}};   // Travolta: point up / point down
      if(i===0)return {...face,...hips,...point,fx:'discoball'};
      if(i>=72)return {...face,root:{y:34},lThigh:{r:88},rThigh:{r:-88},lShin:{r:0},rShin:{r:0},lFoot:{r:-90},rFoot:{r:90},lUpper:{r:-170},rUpper:{r:20},lLower:{r:0},rLower:{r:60},mouth:4,eyes:i%2?2:0,sound:i===72?'plof':''};   // finale: splits
      if(ph>=12)return {...face,...hips,head:{r:[0,90,180,-90][ph-12]},lUpper:{r:-160},rUpper:{r:160},lLower:{r:0},rLower:{r:0},sound:ph===12?'spin':''};   // headspin every 2 s
      return {...face,...hips,...point};
    },{music:'disco',props:['afro','shades','flareL','flareR','discoShirt']}),
    count_hop:A(8,[F(1,crouch),F(2,{root:{y:-35},rUpper:{r:-170},rLower:{r:0},mouth:1},'boing'),F(1,{root:{y:-10},rUpper:{r:-170},rLower:{r:0}}),F(1,{...crouch,rUpper:{r:-170},rLower:{r:0}})]),
  };
  for(const n in lib)if(!n.startsWith('dance_'))lib[n]=densify(lib[n]);
  return lib;
}

</script>
<script>
const $=id=>document.getElementById(id);
const svg=$('svg');
const doll=createDoll($('rig'));
const groups=doll.groups;
// handles
for(const id of ORDER){const t=R[id].tip;if(!t)continue;
  groups[id].append(el('circle',{cx:t[0],cy:t[1],r:R[id].small?3.5:(id==='root'?8:5),class:'handle','data-joint':id}));
  groups[id].append(el('circle',{cx:t[0],cy:t[1],r:R[id].small?9:16,class:'hit','data-joint':id}));}
// lids must stay above irises but below hat; handles for irises were appended to iris groups, fine.

let sel=null,drag=null;
function svgPoint(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function ctmOf(id){return groups[id].getCTM();}
svg.addEventListener('pointerdown',e=>{
  const t=e.target;if(!t.classList.contains('hit'))return;e.preventDefault();
  const id=t.dataset.joint;select(id);const m=svgPoint(e);const c=ctmOf(id);
  const parentCTM=R[id].parent?ctmOf(R[id].parent):$('rig').getCTM();
  drag={id,start:m,pv:{x:c.e,y:c.f},inv:parentCTM.inverse(),r0:doll.pose[id].r,x0:doll.pose[id].x,y0:doll.pose[id].y,a0:Math.atan2(m.y-c.f,m.x-c.e),move:!!R[id].move};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;const m=svgPoint(e),p=doll.pose[drag.id];
  if(drag.move){const dx=m.x-drag.start.x,dy=m.y-drag.start.y,i=drag.inv;
    p.x=Math.round(drag.x0+i.a*dx+i.c*dy);p.y=Math.round(drag.y0+i.b*dx+i.d*dy);}
  else{const a=Math.atan2(m.y-drag.pv.y,m.x-drag.pv.x);let r=drag.r0+(a-drag.a0)*180/Math.PI;r=((r+180)%360+360)%360-180;p.r=Math.round(r);}
  refresh();
});
const endDrag=()=>drag=null;svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);

function refresh(){doll.apply();syncSliders();
  document.querySelectorAll('.mouth').forEach(b=>b.classList.toggle('on',+b.dataset.m===(doll.pose.mouth||0)));
  $('btnEyes').classList.toggle('on',doll.pose.eyes===1);$('btnSquint').classList.toggle('on',doll.pose.eyes===2);$('btnXX').classList.toggle('on',doll.pose.eyes===3);}
function select(id){sel=id;document.querySelectorAll('.handle').forEach(h=>h.classList.toggle('sel',h.dataset.joint===id));$('jointName').textContent=PRETTY[id];syncSliders();}
function syncSliders(){if(!sel)return;const p=doll.pose[sel];$('sRot').value=p.r;$('vRot').textContent=p.r;$('sX').value=p.x;$('vX').textContent=p.x;$('sY').value=p.y;$('vY').textContent=p.y;}
for(const[s,k]of[['sRot','r'],['sX','x'],['sY','y']])$(s).addEventListener('input',e=>{if(!sel)return;doll.pose[sel][k]=+e.target.value;refresh();});
$('btnReset').onclick=()=>{doll.set(defaultPose());refresh();};
$('chkHandles').onchange=e=>$('stage').classList.toggle('hide-handles',!e.target.checked);
document.querySelectorAll('.mouth').forEach(b=>b.onclick=()=>{doll.pose.mouth=+b.dataset.m;refresh();});
$('btnEyes').onclick=()=>{doll.pose.eyes=doll.pose.eyes===1?0:1;refresh();};
$('btnSquint').onclick=()=>{doll.pose.eyes=doll.pose.eyes===2?0:2;refresh();};
$('btnXX').onclick=()=>{doll.pose.eyes=doll.pose.eyes===3?0:3;refresh();};
$('btnSay').onclick=()=>{SFX.unlock();speak($('sayText').value,doll,{lang:'en-GB',done:refresh});};

// keyframes
let keys=[],cur=-1;
const player=makePlayer({set(p){doll.set(p);refresh();},setProps(l){doll.setProps(l);}});
SFX.names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;$('selSound').append(o);});
function renderFrames(){const box=$('frames');box.innerHTML='';
  keys.forEach((k,i)=>{const d=document.createElement('div');d.className='frame'+(i===cur?' cur':'');
    d.innerHTML=`<b>${i+1}</b><small>${k.hold}f${k.sound?' 🔊':''}${k.fx?' ✨':''}</small>`;d.onclick=()=>{cur=i;doll.set(k.pose);refresh();$('nHold').value=k.hold;$('selSound').value=k.sound||'';$('nFx').value=k.fx||'';renderFrames();};box.append(d);});
  if(!keys.length)box.innerHTML='<span class="hint">No keyframes. Pose the doll and press "+ Add keyframe".</span>';}
const frameFromUI=()=>({hold:+$('nHold').value||3,sound:$('selSound').value,fx:$('nFx').value.trim(),pose:clone(doll.pose)});
$('btnAddKey').onclick=()=>{keys.splice(cur+1,0,frameFromUI());cur++;renderFrames();};
$('btnUpdKey').onclick=()=>{if(cur<0)return;keys[cur]=frameFromUI();renderFrames();};
$('btnDelKey').onclick=()=>{if(cur<0)return;keys.splice(cur,1);cur=Math.min(cur,keys.length-1);renderFrames();};
$('btnPlay').onclick=()=>{SFX.unlock();player.play({...(lib[$('animName').value.trim()]||{}),fps:+$('nFps').value||8,frames:keys},{loop:$('chkLoop').checked,step:$('chkStep').checked});};
$('btnStop').onclick=()=>player.stop();

// library
let lib=makeDefaultLib();
function renderLib(){const s=$('animList'),v=s.value;s.innerHTML='';for(const n in lib){const o=document.createElement('option');o.textContent=n;s.append(o);}if(lib[v])s.value=v;}
function loadAnim(n){const a=lib[n];if(!a)return;player.stop();keys=clone(a.frames);$('nFps').value=a.fps;cur=0;doll.set(keys[0].pose);refresh();
  $('nHold').value=keys[0].hold;$('selSound').value=keys[0].sound||'';$('nFx').value=keys[0].fx||'';renderFrames();$('animName').value=n;}
$('btnLoad').onclick=()=>loadAnim($('animList').value);
$('animList').onchange=()=>loadAnim($('animList').value);
$('btnSave').onclick=()=>{const n=$('animName').value.trim();if(!n||!keys.length){alert('Give it a name and add at least one keyframe.');return;}
  lib[n]={...(lib[n]||{}),fps:+$('nFps').value||8,frames:clone(keys)};renderLib();$('animList').value=n;};
$('btnDelAnim').onclick=()=>{if(confirm('Delete '+$('animList').value+'?')){delete lib[$('animList').value];renderLib();}};
$('btnExport').onclick=()=>{$('jsonBox').value=JSON.stringify({rig:'terrance-v4',animations:lib});};
$('btnDownload').onclick=()=>{const blob=new Blob([JSON.stringify({rig:'terrance-v4',animations:lib})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='animations.json';a.click();};
$('btnImport').onclick=()=>{try{const d=JSON.parse($('jsonBox').value);lib={...lib,...(d.animations||d)};renderLib();}catch(e){alert('That is not valid JSON.');}};
$('btnDefaults').onclick=()=>{if(confirm('Replace library with the built-in animations?')){lib=makeDefaultLib();renderLib();loadAnim('idle_breathe');}};
renderLib();loadAnim('idle_breathe');select('head');
</script>
</body>
